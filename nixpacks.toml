[phases.setup]
nixPkgs = ["nodejs_20"]

[start]
# 2026-06-21: NODE_ENV NO se fuerza acá (revertido por sospecha de que el fail-fast
# de JWT_SECRET podía crashear el deploy → "Railway andando mal"). Para activar las
# protecciones prod-only (cookie Secure, webhook fail-closed, JWT fail-fast, no-leak
# de errores, CORS Socket.IO), setear NODE_ENV=production como VARIABLE en Railway
# (Settings → Variables) — así es un toggle, no rompe el deploy si algo falta.
cmd = "node index.js"
