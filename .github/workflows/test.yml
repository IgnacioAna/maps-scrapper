name: Tests

# Audit 2026-06-20: antes nada corría los tests solo. Esto los corre en cada push
# y en cada PR → te avisa si algo rompe ANTES de que Railway deploye.
# 2026-07-11: solo main (master es espejo del mismo commit → corría todo DOBLE y
# duplicaba los mails de "Run failed"). TZ alineada a la zona de negocio: los
# tests con aserciones de "hoy/ayer" fallaban en el runner (UTC) cuando el push
# era de noche en AR — cerca de la medianoche UTC los buckets de día difieren.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          TZ: America/Argentina/Buenos_Aires
